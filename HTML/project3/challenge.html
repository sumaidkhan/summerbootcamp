<!DOCTYPE html>
<html>
<head>
    <title>University Course Registration Form</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <form>

        <fieldset>
            <legend>Student Information</legend>

            <label>Full Name:</label><br>
            <input type="text" name="fullname" required><br><br>

            <label>Roll Number:</label><br>
            <input type="text" name="rollno" required><br><br>

            <label>Email:</label><br>
            <input type="email" name="email" required><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" name="phone" required><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
        </fieldset>

        <br>

        <fieldset>
            <legend>Academic Information</legend>

            <label>Program:</label><br>
            <select name="program" required>
                <option value="">Select Program</option>
                <option value="BSCS">BSCS</option>
                <option value="BSSE">BSSE</option>
                <option value="BSIT">BSIT</option>
            </select>
            <br><br>

            <label>Semester:</label><br>
            <select name="semester">
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
                <option>7th Semester</option>
                <option>8th Semester</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Subjects</legend>

            <input type="checkbox" name="subject" value="Programming Fundamentals">
            Programming Fundamentals<br>

            <input type="checkbox" name="subject" value="Database Systems">
            Database Systems<br>

            <input type="checkbox" name="subject" value="Web Development">
            Web Development<br>

            <input type="checkbox" name="subject" value="Software Engineering">
            Software Engineering<br>

            <input type="checkbox" name="subject" value="Computer Networks">
            Computer Networks
        </fieldset>

        <br>

        <fieldset>
            <legend>Additional Information</legend>

            <label>Address:</label><br>
            <textarea name="address" rows="4" cols="40"></textarea>
            <br><br>

            <label>Comments:</label><br>
            <textarea name="comments" rows="4" cols="40"></textarea>
        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
