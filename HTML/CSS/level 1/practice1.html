<html>
<head>
    <title>Button Styles</title>

    <!-- Internal CSS using <style> tag -->
    <style>
        .blue-btn {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>

    <!-- External CSS example -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Button with External CSS (Green) -->
    <button class="green-btn">Green Button</button>

    <br><br>

    <!-- Button with Internal CSS using <style> tag (Blue) -->
    <button class="blue-btn">Blue Button</button>

    <br><br>

    <!-- Button with Inline CSS (Pink) -->
    <button style="background-color: pink; color: white; padding: 10px 20px; border: none;">
        Pink Button
    </button>

</body>
